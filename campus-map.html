<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style>
        #map { height: 500px; }
        
     </style>
</head>
<body>
     <h1>Map</h1>
     <div id="map"></div>

     
</body>
<script>
function initMap(mapDataUrl){
    const map = L.map('map').setView([8.3603,124.8684])

    //OpenStreetMap
    const OpenStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
})

//satellite
const satellite = L.tileLayer(
    'https://server.arcginsoneline.com/ArcGIS/rest/services/World_Imagenary/MapServer/yile/{z}/{y}/{x}',
    {attribution:'tiles (c) Esri - Source, Maxar, Earthstar Geographics, and GIS User Community'}
);

OpenStreetMap.addTo(map);
console.log("Base map tile layer loaded" + Date());

const markerGroups = {};

fetch(mapDataUrl)
    .then(response => response.json())
    .then(data=>{
        data.forEach(pin => {
            const type = pin.locationType || "Other";

            //Create Marker Group
            if(!markerGroups[type]){
                markerGroups[types] = L.layerGroup();
            }

            //Marker and Popup
                   const marker = L.marker([pin,lat, pinlng]).addTo(map);
            const img = `<img src='$(pin.img)' class="popup-image">`;
            marker.bindPopup(`
            ${img} <br>
            <b>${pin.title}</b>
            <p>${pin.description}
            `);

            console.log(`${pin.name} Loaded ` + Data());

            markerGroups[type].addLayer(marker);
        });

        //Add marker groups into the map according to marker filter
        object.values(markerGroups).forEach(group => group.addTo(map));

        //Map Layer Control
        const baseMaps={
            "OpenStreetMap":OpenStreetMap,
            "Satellite":satellite
        }

        const overlayMap={};

        //Add marker groups into the basemap
        Object.keys(markerGroups).forEach(type=>{
            overlayMap[type] = markerGroups[type];
        });

        L.control.layers(baseMaps,overlayMaps,{collapsed:false}.addTo(map));
    })
    .catch(err=> console.err('Error Loading JSON',err));

}
document.addEventListener("DOMContentLoaded",()=>{
    initMap('campus-map.json');
});
</script>
</html>
